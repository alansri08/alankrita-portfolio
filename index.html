<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alankrita Srivastava — Portfolio</title><link rel="preconnect" href="https://fonts.googleapis.com"><style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fraunces:wght@700&family=Nunito:wght@400;600;700;800;900&display=swap');
:root{--h:Fraunces;--b:Nunito;--a:Caveat}*{box-sizing:border-box}body{margin:0;background:#fff9f7;color:#452e3d;font-family:var(--b),sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #aa4b7d;outline-offset:2px}.shell{height:100dvh;max-width:1250px;margin:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}.top{height:42px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}.logo{font-family:var(--a),cursive;font-size:35px;color:#cf689a;font-weight:700}.nav{display:flex;gap:12px}.nav button{border:0;background:transparent;color:#543547;font-size:12px;font-weight:900}.edit{background:#fce1ed;border:0;border-radius:25px;padding:9px 13px;color:#a34175;font-size:12px;font-weight:900}.dashboard{flex:1;min-height:0;display:grid;grid-template-columns:39% 1fr;grid-template-rows:1.35fr 1fr .8fr;gap:12px}.tile{min-height:0;overflow:hidden;border:1px solid #f0d9e3;border-radius:23px;padding:20px;background:white}.intro{grid-column:1;grid-row:1;display:flex;flex-direction:column;justify-content:center}.projects{grid-column:2;grid-row:1/3;background:#f6b9d2;border-color:#f6b9d2;display:flex;flex-direction:column;gap:12px}.story{grid-column:1;grid-row:2;background:#fff0f6}.how{grid-column:2;grid-row:3;background:#fff0f6;display:flex;flex-direction:column;justify-content:center}.about{grid-column:1;grid-row:3}.eyebrow{font-size:10px;font-weight:900;letter-spacing:1.3px;color:#b75185}h1,h2{font-family:var(--h),Georgia,serif;line-height:1.08}h1{font-size:clamp(28px,3.3vw,47px);margin:9px 0}h1 em{color:#d86d9d;font-style:normal}h2{font-size:clamp(20px,2.2vw,28px);margin:0}.intro p{font-size:13px;line-height:1.5;max-width:400px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{background:#fce5ef;color:#a34578;border-radius:20px;padding:6px 10px;font-size:10px;font-weight:900}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.head button{border:0;background:#fff8fb;border-radius:20px;padding:7px 10px;font-size:11px;font-weight:900;color:#ae5284}.projects h2{color:#fff;font-size:32px}.hand{font-family:var(--a),cursive;font-size:21px;color:#ae5284}.projects .hand{color:#fff}.projectlist{flex:1;min-height:0;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:10px}.project{background:#fff;border:0;border-radius:16px;text-align:left;padding:13px;display:flex;align-items:center;gap:13px;color:#493443;min-height:0}.project:hover{box-shadow:0 7px 17px #b2588329}.glyph{background:#fce7ef;border-radius:12px;display:grid;place-items:center;min-width:68px;height:75%;color:#c85c90;font-family:var(--h),serif;font-size:23px}.project b{display:block;font-size:15px}.project strong{display:block;font-size:11px;margin:5px 0}.project small{display:block;font-size:11px;color:#806878}.story p,.about p,.how p{font-size:12px;line-height:1.45;color:#6e5868}.steps{font-size:11px;font-weight:800;line-height:1.9}.links{display:flex;gap:6px;flex-wrap:wrap}.links a{color:#8e3c6c;text-decoration:none;background:#fff1f7;border:1px solid #f1d5e2;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:900}.overlay{position:fixed;inset:0;background:#3d2131aa;display:grid;place-items:center;padding:15px;z-index:10;backdrop-filter:blur(6px)}[hidden]{display:none!important}.dialog{width:min(680px,100%);max-height:90dvh;overflow:auto;background:#fff9f8;border:2px solid #e9a9c6;border-radius:24px;padding:26px;position:relative}.dialog h2{font-size:29px;margin:4px 0 15px}.close{position:absolute;right:18px;top:15px;background:white;border:1px solid #ebc6d8;border-radius:50%;width:34px;height:34px;font-size:22px}.detail{background:white;border:1px solid #f0d9e3;padding:13px;border-radius:12px;margin:9px 0;font-size:13px;line-height:1.55}.detail b{display:block;color:#ae4e80;margin-bottom:4px}.video{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;margin:9px 0}.editorgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:800}.field input,.field textarea,.field select{padding:10px;border:1px solid #e7c8d6;border-radius:10px;background:white;color:#3f2c39;min-width:0}.field textarea{min-height:75px}.full{grid-column:1/-1}.action{border:0;background:#d76b9e;color:white;padding:11px 16px;border-radius:20px;font-size:12px;font-weight:900;margin:8px 6px 0 0}.muted{color:#765f6c;font-size:12px;line-height:1.5}.linkbtn{display:inline-block;color:#9c4276;text-decoration:none;font-weight:900;font-size:12px;margin-top:12px}
@media(max-width:800px){.shell{padding:8px;gap:6px}.top{height:32px}.logo{font-size:28px}.nav{display:none}.dashboard{grid-template-columns:1fr;grid-template-rows:1fr 2.3fr .75fr .62fr .7fr;gap:6px}.tile{border-radius:15px;padding:9px 12px}.intro{grid-column:1;grid-row:1}.projects{grid-column:1;grid-row:2;gap:6px}.story{grid-column:1;grid-row:3}.how{grid-column:1;grid-row:4}.about{grid-column:1;grid-row:5}.intro h1{font-size:25px;margin:4px 0}.intro p{font-size:10px;line-height:1.25;margin:3px 0}.chips{display:none}.eyebrow{font-size:8px}.head h2,.projects h2{font-size:19px}.hand{font-size:16px}.projectlist{gap:5px}.project{padding:5px 9px;gap:8px;border-radius:9px}.glyph{min-width:40px;font-size:15px}.project b{font-size:12px}.project strong{font-size:10px;margin:3px 0}.project small{display:none}.story p,.about p,.how p{font-size:10px;margin:4px 0}.steps{display:none}.links a{font-size:9px;padding:4px 6px}.head button{font-size:9px;padding:5px}.editorgrid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header class="top"><div class="logo">Alankrita.</div><nav class="nav"><button onclick="openDetail('projects')">Projects</button><button onclick="openDetail('story')">My Story</button><button onclick="openDetail('how')">How I Work</button><button onclick="openDetail('about')">About Me</button></nav><button class="edit" onclick="editSite()">✎ Edit site</button></header><main class="dashboard"><section class="tile intro"><div class="eyebrow">ANALYTICS ENGINEERING + DATA ANALYTICS</div><h1>Hi, I’m <em>Alankrita.</em></h1><p id="intro"></p><div class="chips"><span>SQL + Python</span><span>Databricks</span><span>Business thinking</span></div></section><section class="tile projects"><div class="head"><h2>Projects</h2><span class="hand">where the evidence lives</span></div><div class="projectlist" id="projects"></div></section><section class="tile story"><div class="head"><h2>My story</h2><button onclick="openDetail('story')">Read my story ↗</button></div><p id="story"></p><div class="steps">01 · Marketing → 02 · Analytics → 03 · Data foundations</div></section><section class="tile how"><div class="head"><h2>How I work</h2><button onclick="openDetail('how')">My approach ↗</button></div><p id="how"></p></section><section class="tile about"><div class="head"><h2>About me</h2><button onclick="openDetail('about')">More ↗</button></div><p id="about"></p><div class="links"><a id="email">Email</a><a id="linkedin" target="_blank" rel="noopener noreferrer">LinkedIn</a><a id="github" target="_blank" rel="noopener noreferrer">GitHub</a></div></section></main></div><div class="overlay" id="overlay" hidden><div class="dialog" role="dialog" aria-modal="true"><button class="close" onclick="closeDialog()" aria-label="Close">×</button><div id="dialogbody"></div></div></div><script>
const defaults={intro:"Curious about both how data becomes trustworthy and what it can tell us. I build, question and connect the technical work to business decisions.",story:"Marketing was my starting point. Curiosity took me deeper into data.",how:"Clarify → Build → Validate → Analyze → Explain. AI can accelerate the process; I still verify the results.",about:"UMD Smith · MS Marketing Analytics · Dec 2026",email:"",linkedin:"https://www.linkedin.com/",github:"https://github.com/alansri08",headingFont:"Fraunces",bodyFont:"Nunito",accentFont:"Caveat",storyVideo:"",projects:[{title:"Churn data at scale",metric:"21M+ records · 80% less preparation",desc:"Databricks, PySpark and SQL pipeline for subscriber churn analysis.",glyph:"21M",video:"",link:"https://github.com/alansri08/kkbox-churn-prediction"},{title:"Retention, corrected",metric:"24% retention understatement found",desc:"Corrected right-censoring, then investigated a R$261K fulfillment leak.",glyph:"24%",video:"",link:"https://github.com/alansri08/ecommerce-funnel-cohort-analysis"},{title:"Should this feature launch?",metric:"−0.82 pp Day-7 retention",desc:"Detected sample ratio mismatch in a 90K+ user test and recommended holding launch.",glyph:"A/B",video:"",link:"https://github.com/alansri08/mobile-app-growth-experimentation"}]};
let d;try{d={...defaults,...JSON.parse(localStorage.getItem("alankrita-portfolio")||"{}")}}catch{d=structuredClone(defaults)}if(!Array.isArray(d.projects)||d.projects.length!==3)d.projects=structuredClone(defaults.projects);
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function embed(raw){try{const u=new URL(raw);const h=u.hostname.replace(/^www\./,"");let id;if(h==="youtu.be")id=u.pathname.split("/")[1];else if(["youtube.com","m.youtube.com","youtube-nocookie.com"].includes(h))id=u.searchParams.get("v")||u.pathname.match(/^\/(?:embed|shorts|live)\/([^/]+)/)?.[1];if(id&&/^[a-zA-Z0-9_-]{11}$/.test(id))return "https://www.youtube-nocookie.com/embed/"+id;if(["loom.com","share.loom.com"].includes(h)){id=u.pathname.match(/^\/(?:share|embed)\/([a-zA-Z0-9-]+)/)?.[1];if(id&&/^[a-zA-Z0-9-]{12,}$/.test(id))return "https://www.loom.com/embed/"+id}}catch{}return null}
function video(raw){const src=embed(raw);return src?'<iframe class="video" loading="lazy" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Video walkthrough" src="'+esc(src)+'"></iframe>':""}
function render(){for(const k of ["intro","story","how","about"])$(k).textContent=d[k];$("projects").innerHTML=d.projects.map((p,i)=>'<button class="project" onclick="openDetail('+i+')"><span class="glyph">'+esc(p.glyph)+'</span><span><b>'+esc(p.title)+'</b><strong>'+esc(p.metric)+'</strong><small>'+esc(p.desc)+'</small></span></button>').join("");$("email").href=d.email?"mailto:"+d.email:"#";$("linkedin").href=d.linkedin;$("github").href=d.github;document.documentElement.style.setProperty("--h",'"'+d.headingFont+'"');document.documentElement.style.setProperty("--b",'"'+d.bodyFont+'"');document.documentElement.style.setProperty("--a",'"'+d.accentFont+'"');const fonts=[d.headingFont,d.bodyFont,d.accentFont];let link=$("fontlink");if(!link){link=document.createElement("link");link.id="fontlink";link.rel="stylesheet";document.head.appendChild(link)}link.href="https://fonts.googleapis.com/css2?"+[...new Set(fonts)].map(x=>"family="+encodeURIComponent(x).replace(/%20/g,"+").replace(/%2B/g,"+")).join("&")+"&display=swap"}
function show(html){$("dialogbody").innerHTML=html;$("overlay").hidden=false}
function closeDialog(){$("overlay").hidden=true;$("dialogbody").innerHTML=""}
function openDetail(key){let title,body="";if(typeof key==="number"){const p=d.projects[key];title=p.title;body='<p class="muted">'+esc(p.desc)+'</p>'+video(p.video)+'<div class="detail"><b>Key result</b>'+esc(p.metric)+'</div><a class="linkbtn" target="_blank" rel="noopener noreferrer" href="'+esc(p.link)+'">Explore project on GitHub ↗</a>'}else if(key==="projects"){title="Featured projects";body=d.projects.map((p,i)=>'<button class="project detail" onclick="openDetail('+i+')">'+esc(p.title)+" — "+esc(p.metric)+'</button>').join("")}else{title=({story:"My story",how:"How I work",about:"About me"})[key];body='<p class="muted">'+esc(d[key])+'</p>';if(key==="story")body+=video(d.storyVideo);if(key==="how")body+='<div class="detail"><b>My approach</b>Understand the business question, prepare and transform data, validate assumptions and outputs, and communicate decisions.</div>';if(key==="about")body+='<div class="detail">I’m completing an MS in Marketing Analytics at the University of Maryland, graduating December 2026. My experience spans marketing analytics, SQL, Databricks, Tableau, experimentation and AI-assisted workflows.</div>'}show('<h2>'+esc(title)+'</h2>'+body)}
const field=(label,key,val,type="text")=>'<label class="field '+(type==="textarea"?"full":"")+'">'+esc(label)+(type==="textarea"?'<textarea data-key="'+esc(key)+'">'+esc(val)+'</textarea>':'<input data-key="'+esc(key)+'" value="'+esc(val)+'">')+'</label>';
const choose=(label,key,val,opts)=>'<label class="field">'+esc(label)+'<select data-key="'+esc(key)+'">'+opts.map(o=>'<option '+(o===val?"selected":"")+'>'+esc(o)+'</option>').join("")+'</select></label>';
function editSite(){let h='<h2>Edit your portfolio</h2><p class="muted">Change text, video links and fonts. Click Preview changes. Download your updated data file to publish the changes on GitHub.</p><div class="editorgrid">';for(const k of ["intro","story","how","about"])h+=field(k==="how"?"How I Work":k[0].toUpperCase()+k.slice(1),k,d[k],"textarea");for(const k of ["email","linkedin","github","storyVideo"])h+=field(k==="storyVideo"?"My Story YouTube/Loom URL":k,k,d[k]);h+=choose("Heading font","headingFont",d.headingFont,["Fraunces","Playfair Display","Lora","Outfit","Poppins","DM Sans","Manrope"])+choose("Body font","bodyFont",d.bodyFont,["Nunito","Outfit","Poppins","DM Sans","Quicksand"])+choose("Handwritten font","accentFont",d.accentFont,["Caveat","Dancing Script","Pacifico","Kalam"]);d.projects.forEach((p,i)=>{h+='<div class="full"><h3>Project '+(i+1)+'</h3></div>';for(const k of ["title","metric","desc","video","link"])h+=field(k==="video"?"YouTube/Loom URL":k,"p"+i+"."+k,p[k],k==="desc"?"textarea":"text")});h+='</div><button class="action" onclick="saveEdits()">Preview changes</button><button class="action" onclick="downloadData()">Download updated data</button><p class="muted">To publish: replace data.json in your GitHub repository with the downloaded file. The live website loads that file for all visitors. Local edits are visible only to you until published.</p>';show(h)}
function readEdits(){document.querySelectorAll("[data-key]").forEach(el=>{const key=el.dataset.key;if(key.startsWith("p")){const m=key.match(/^p(\d+)\.(\w+)$/);if(m)d.projects[+m[1]][m[2]]=el.value}else d[key]=el.value})}
function saveEdits(){readEdits();localStorage.setItem("alankrita-portfolio",JSON.stringify(d));render();closeDialog()}
function downloadData(){readEdits();const blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="data.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);localStorage.setItem("alankrita-portfolio",JSON.stringify(d));render()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDialog()});$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeDialog()});
fetch("data.json").then(r=>r.ok?r.json():null).then(x=>{if(x&&!localStorage.getItem("alankrita-portfolio")){d={...d,...x};render()}}).catch(()=>{});render();
</script></body></html>
