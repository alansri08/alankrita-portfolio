<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alankrita Srivastava — Portfolio</title><link rel="preconnect" href="https://fonts.googleapis.com"><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@400;600;700&display=swap');
:root{--h:"Space Grotesk";--b:"DM Sans";--a:"Space Grotesk"}*{box-sizing:border-box}body{margin:0;background:#f8f8ed;color:#203e31;font-family:var(--b),sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{height:100dvh;max-width:1450px;margin:auto;padding:16px 24px;display:flex;flex-direction:column;gap:12px}.top{height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;border-bottom:1px solid #b9cdb4}.logo{font-family:var(--h);font-size:24px;color:#20533b;font-weight:700;letter-spacing:-1px}.nav{display:flex;gap:15px}.nav button{border:0;background:transparent;color:#315a43;font-size:12px;font-weight:800}.edit{background:#255d42;border:0;border-radius:8px;padding:9px 14px;color:white;font-size:12px;font-weight:800}.dashboard{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr .9fr 1fr;grid-template-rows:1.1fr .9fr;gap:14px}.tile{position:relative;min-height:0;overflow:hidden;border:1px solid #b8cbb4;border-radius:14px;padding:48px 17px 15px;background:#fffef7;box-shadow:0 5px 0 #dce8d4}.tile:before{content:"";position:absolute;top:0;left:0;right:0;height:31px;background:#dcebd4;border-bottom:1px solid #b9cdb4}.tile:after{content:"●  ●  ●";position:absolute;top:9px;left:14px;color:#79a389;font-size:10px;letter-spacing:3px}.tile>*{position:relative}.intro{grid-column:1;grid-row:1;background:#e8f0df;display:flex;flex-direction:column;justify-content:center}.projects{grid-column:2/4;grid-row:1;background:#cfe3c7;display:flex;flex-direction:column;gap:12px}.projects:before{background:#b5d1ad}.story{grid-column:1;grid-row:2;display:flex;flex-direction:column}.how{grid-column:2;grid-row:2;background:#d9e8b5;display:flex;flex-direction:column;justify-content:center}.about{grid-column:3;grid-row:2;background:#edf2df}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#518062}h1,h2{font-family:var(--h),sans-serif;line-height:1.02;letter-spacing:-.06em}h1{font-size:clamp(33px,4vw,58px);margin:12px 0}h1 em{color:#387a54;font-style:normal}h2{font-size:clamp(23px,2.6vw,38px);margin:0}.intro p{font-size:13px;line-height:1.5}.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{background:#fffef5;color:#37664b;border:1px solid #b5cfae;border-radius:7px;padding:7px 10px;font-size:10px;font-weight:800}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.head button{border:1px solid #a9c5a7;background:#fffef5;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:800;color:#255b44}.projects h2{color:#23573e}.hand{font-family:var(--a);font-size:12px;color:#4e7557;font-weight:700}.projectlist{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.project{background:#fffef7;border:1px solid #b6cfae;border-radius:10px;text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;color:#264d3a;min-height:0}.project:hover{transform:translateY(-3px);box-shadow:0 6px 0 #b0cba5}.glyph{background:#d9e9ca;border-radius:8px;display:grid;place-items:center;width:100%;height:40%;min-height:48px;color:#255a40;font-family:var(--h);font-size:clamp(19px,3vw,35px);font-weight:700}.project b{display:block;font-size:14px}.project strong{display:block;font-size:11px;margin:6px 0}.project small{display:block;font-size:11px;color:#627867}.story p,.about p,.how p{font-size:12px;line-height:1.45;color:#4b6654}.steps{font-size:11px;font-weight:800;line-height:2}.links{display:flex;gap:6px;flex-wrap:wrap}.links a{color:#245a41;text-decoration:none;background:#fffef7;border:1px solid #bfd5b7;padding:6px 9px;border-radius:7px;font-size:10px;font-weight:800}.story-art{margin:auto 0 9px;background:#e4eeda;border:1px solid #c2d6bd;border-radius:9px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}.mini-slide{background:#fffef5;padding:10px;box-shadow:3px 3px 0 #b7d1b1;border:1px solid #b7d1b1;font-size:clamp(12px,1.5vw,19px);font-weight:800;letter-spacing:-.04em}.story-actions{display:flex;gap:6px}.story-actions button{border:0;border-radius:7px;padding:8px;background:#285f45;color:white;font-size:10px;font-weight:800}.widget-graphic{margin:10px 0;display:flex;align-items:end;gap:7px;height:60px}.widget-graphic span{flex:1;border-radius:5px 5px 0 0;background:#518c65}.widget-graphic span:nth-child(1){height:40%}.widget-graphic span:nth-child(2){height:70%;background:#8cad76}.widget-graphic span:nth-child(3){height:55%}.widget-graphic span:nth-child(4){height:95%;background:#286246}.widget-graphic span:nth-child(5){height:75%}.overlay{position:fixed;inset:0;background:#183528bb;display:grid;place-items:center;padding:15px;z-index:10;backdrop-filter:blur(6px)}[hidden]{display:none!important}.dialog{width:min(700px,100%);max-height:90dvh;overflow:auto;background:#fbfcf2;border:2px solid #adc7a9;border-radius:17px;padding:28px;position:relative}.dialog h2{font-size:30px;margin:4px 0 15px}.close{position:absolute;right:18px;top:15px;background:white;border:1px solid #a6c5a6;border-radius:50%;width:34px;height:34px;font-size:22px}.detail{background:white;border:1px solid #c6d9bd;padding:13px;border-radius:10px;margin:9px 0;font-size:13px;line-height:1.55}.detail b{display:block;color:#276044;margin-bottom:4px}.video{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;margin:9px 0}.editorgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:800}.field input,.field textarea,.field select{padding:10px;border:1px solid #b4cdae;border-radius:10px;background:white;color:#203d32;min-width:0}.field textarea{min-height:75px}.full{grid-column:1/-1}.action{border:0;background:#275c43;color:white;padding:11px 16px;border-radius:9px;font-size:12px;font-weight:800;margin:8px 6px 0 0}.muted{color:#526c5c;font-size:12px;line-height:1.5}.linkbtn{display:inline-block;color:#245b44;text-decoration:none;font-weight:800;font-size:12px;margin-top:12px}
@media(max-width:800px){.shell{padding:8px;gap:6px}.top{height:34px}.logo{font-size:20px}.nav{display:none}.dashboard{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1.7fr 1fr;gap:7px}.tile{border-radius:10px;padding:30px 9px 7px}.tile:before{height:23px}.tile:after{top:6px;font-size:8px}.intro{grid-column:1/3;grid-row:1}.projects{grid-column:1/3;grid-row:2;gap:5px}.story{grid-column:1;grid-row:3}.how{grid-column:2;grid-row:3}.about{display:none}.intro h1{font-size:25px;margin:4px 0}.intro p{font-size:10px;line-height:1.25;margin:3px 0}.chips{display:none}.eyebrow{font-size:8px}.head h2,.projects h2{font-size:19px}.hand{font-size:9px}.projectlist{gap:5px}.project{padding:6px;gap:5px}.glyph{font-size:17px;min-height:32px}.project b{font-size:10px}.project strong{font-size:9px;margin:2px 0}.project small{display:none}.story p,.about p,.how p{font-size:9px;margin:4px 0}.steps{display:none}.story-art{margin:4px 0;padding:5px}.mini-slide{padding:5px;font-size:10px}.story-actions button{font-size:9px;padding:5px}.widget-graphic{height:33px;margin:4px 0}.head button{font-size:9px;padding:5px}.editorgrid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header class="top"><div class="logo">Alankrita.</div><nav class="nav"><button onclick="openDetail('projects')">Projects</button><button onclick="openDetail('story')">My Story</button><button onclick="openDetail('how')">How I Work</button><button onclick="openDetail('about')">About Me</button></nav><button class="edit" onclick="editSite()">✎ Edit site</button></header><main class="dashboard"><section class="tile intro"><div class="eyebrow">ANALYTICS ENGINEERING + DATA ANALYTICS</div><h1>Hi, I’m <em>Alankrita.</em></h1><p id="intro"></p><div class="chips"><span>SQL + Python</span><span>Databricks</span><span>Business thinking</span></div></section><section class="tile projects"><div class="head"><h2>Projects</h2><span class="hand">where the evidence lives</span></div><div class="projectlist" id="projects"></div></section><section class="tile story"><div class="head"><h2>My story</h2><button onclick="openDetail('story')">Read my story ↗</button></div><p id="story"></p><div class="story-art"><div class="mini-slide">MY STORY<br>From marketing to data.</div><span>▣</span></div><div class="story-actions"><button onclick="openDetail('story')">View slides ↗</button><button onclick="openStoryVideo()">▶ Watch video</button></div><div class="steps">01 · Marketing → 02 · Analytics → 03 · Data foundations</div></section><section class="tile how"><div class="head"><h2>How I work</h2><button onclick="openDetail('how')">My approach ↗</button></div><p id="how"></p><div class="widget-graphic"><span></span><span></span><span></span><span></span><span></span></div></section><section class="tile about"><div class="head"><h2>About me</h2><button onclick="openDetail('about')">More ↗</button></div><p id="about"></p><div class="links"><a id="email">Email</a><a id="linkedin" target="_blank" rel="noopener noreferrer">LinkedIn</a><a id="github" target="_blank" rel="noopener noreferrer">GitHub</a></div></section></main></div><div class="overlay" id="overlay" hidden><div class="dialog" role="dialog" aria-modal="true"><button class="close" onclick="closeDialog()" aria-label="Close">×</button><div id="dialogbody"></div></div></div><script>
const defaults={intro:"Curious about both how data becomes trustworthy and what it can tell us. I build, question and connect the technical work to business decisions.",story:"Marketing was my starting point. Curiosity took me deeper into data.",how:"Clarify → Build → Validate → Analyze → Explain. AI can accelerate the process; I still verify the results.",about:"UMD Smith · MS Marketing Analytics · Dec 2026",email:"",linkedin:"https://www.linkedin.com/",github:"https://github.com/alansri08",headingFont:"Space Grotesk",bodyFont:"DM Sans",accentFont:"Space Grotesk",storyVideo:"",projects:[{title:"Churn data at scale",metric:"21M+ records · 80% less preparation",desc:"Databricks, PySpark and SQL pipeline for subscriber churn analysis.",glyph:"21M",video:"",link:"https://github.com/alansri08/kkbox-churn-prediction"},{title:"Retention, corrected",metric:"24% retention understatement found",desc:"Corrected right-censoring, then investigated a R$261K fulfillment leak.",glyph:"24%",video:"",link:"https://github.com/alansri08/ecommerce-funnel-cohort-analysis"},{title:"Should this feature launch?",metric:"−0.82 pp Day-7 retention",desc:"Detected sample ratio mismatch in a 90K+ user test and recommended holding launch.",glyph:"A/B",video:"",link:"https://github.com/alansri08/mobile-app-growth-experimentation"}]};
let d;try{d={...defaults,...JSON.parse(localStorage.getItem("alankrita-portfolio")||"{}")}}catch{d=structuredClone(defaults)}if(!Array.isArray(d.projects)||d.projects.length!==3)d.projects=structuredClone(defaults.projects);
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function embed(raw){try{const u=new URL(raw);const h=u.hostname.replace(/^www\./,"");let id;if(h==="youtu.be")id=u.pathname.split("/")[1];else if(["youtube.com","m.youtube.com","youtube-nocookie.com"].includes(h))id=u.searchParams.get("v")||u.pathname.match(/^\/(?:embed|shorts|live)\/([^/]+)/)?.[1];if(id&&/^[a-zA-Z0-9_-]{11}$/.test(id))return "https://www.youtube-nocookie.com/embed/"+id;if(["loom.com","share.loom.com"].includes(h)){id=u.pathname.match(/^\/(?:share|embed)\/([a-zA-Z0-9-]+)/)?.[1];if(id&&/^[a-zA-Z0-9-]{12,}$/.test(id))return "https://www.loom.com/embed/"+id}}catch{}return null}
function video(raw){const src=embed(raw);return src?'<iframe class="video" loading="lazy" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Video walkthrough" src="'+esc(src)+'"></iframe>':""}
function render(){for(const k of ["intro","story","how","about"])$(k).textContent=d[k];$("projects").innerHTML=d.projects.map((p,i)=>'<button class="project" onclick="openDetail('+i+')"><span class="glyph">'+esc(p.glyph)+'</span><span><b>'+esc(p.title)+'</b><strong>'+esc(p.metric)+'</strong><small>'+esc(p.desc)+'</small></span></button>').join("");$("email").href=d.email?"mailto:"+d.email:"#";$("linkedin").href=d.linkedin;$("github").href=d.github;document.documentElement.style.setProperty("--h",'"'+d.headingFont+'"');document.documentElement.style.setProperty("--b",'"'+d.bodyFont+'"');document.documentElement.style.setProperty("--a",'"'+d.accentFont+'"');const fonts=[d.headingFont,d.bodyFont,d.accentFont];let link=$("fontlink");if(!link){link=document.createElement("link");link.id="fontlink";link.rel="stylesheet";document.head.appendChild(link)}link.href="https://fonts.googleapis.com/css2?"+[...new Set(fonts)].map(x=>"family="+encodeURIComponent(x).replace(/%20/g,"+").replace(/%2B/g,"+")).join("&")+"&display=swap"}
function show(html){$("dialogbody").innerHTML=html;$("overlay").hidden=false}
function closeDialog(){$("overlay").hidden=true;$("dialogbody").innerHTML=""}
function openStoryVideo(){show("<h2>My Story — Video</h2>"+(video(d.storyVideo)||'<p class="muted">Add your YouTube or Loom link using Edit site to play your video here.</p>'))}
function openDetail(key){let title,body="";if(typeof key==="number"){const p=d.projects[key];title=p.title;body='<p class="muted">'+esc(p.desc)+'</p>'+video(p.video)+'<div class="detail"><b>Key result</b>'+esc(p.metric)+'</div><a class="linkbtn" target="_blank" rel="noopener noreferrer" href="'+esc(p.link)+'">Explore project on GitHub ↗</a>'}else if(key==="projects"){title="Featured projects";body=d.projects.map((p,i)=>'<button class="project detail" onclick="openDetail('+i+')">'+esc(p.title)+" — "+esc(p.metric)+'</button>').join("")}else{title=({story:"My story",how:"How I work",about:"About me"})[key];body='<p class="muted">'+esc(d[key])+'</p>';if(key==="story")body+='<div class="detail"><b>My Story presentation</b>Presentation upload pending. The thumbnail on the homepage is a placeholder, not the original slides.</div><button class="action" onclick="openStoryVideo()">▶ Watch the video</button>'+video(d.storyVideo);if(key==="how")body+='<div class="detail"><b>My approach</b>Understand the business question, prepare and transform data, validate assumptions and outputs, and communicate decisions.</div>';if(key==="about")body+='<div class="detail">I’m completing an MS in Marketing Analytics at the University of Maryland, graduating December 2026. My experience spans marketing analytics, SQL, Databricks, Tableau, experimentation and AI-assisted workflows.</div>'}show('<h2>'+esc(title)+'</h2>'+body)}
const field=(label,key,val,type="text")=>'<label class="field '+(type==="textarea"?"full":"")+'">'+esc(label)+(type==="textarea"?'<textarea data-key="'+esc(key)+'">'+esc(val)+'</textarea>':'<input data-key="'+esc(key)+'" value="'+esc(val)+'">')+'</label>';
const choose=(label,key,val,opts)=>'<label class="field">'+esc(label)+'<select data-key="'+esc(key)+'">'+opts.map(o=>'<option '+(o===val?"selected":"")+'>'+esc(o)+'</option>').join("")+'</select></label>';
function editSite(){let h='<h2>Edit your portfolio</h2><p class="muted">Change text, video links and fonts. Click Preview changes. Download your updated data file to publish the changes on GitHub.</p><div class="editorgrid">';for(const k of ["intro","story","how","about"])h+=field(k==="how"?"How I Work":k[0].toUpperCase()+k.slice(1),k,d[k],"textarea");for(const k of ["email","linkedin","github","storyVideo"])h+=field(k==="storyVideo"?"My Story YouTube/Loom URL":k,k,d[k]);h+=choose("Heading font","headingFont",d.headingFont,["Space Grotesk","DM Sans","Fraunces","Outfit","Poppins","Manrope"])+choose("Body font","bodyFont",d.bodyFont,["DM Sans","Space Grotesk","Nunito","Outfit","Poppins"])+choose("Handwritten font","accentFont",d.accentFont,["Space Grotesk","DM Sans","Caveat","Kalam"]);d.projects.forEach((p,i)=>{h+='<div class="full"><h3>Project '+(i+1)+'</h3></div>';for(const k of ["title","metric","desc","video","link"])h+=field(k==="video"?"YouTube/Loom URL":k,"p"+i+"."+k,p[k],k==="desc"?"textarea":"text")});h+='</div><button class="action" onclick="saveEdits()">Preview changes</button><button class="action" onclick="downloadData()">Download updated data</button><p class="muted">To publish: replace data.json in your GitHub repository with the downloaded file. The live website loads that file for all visitors. Local edits are visible only to you until published.</p>';show(h)}
function readEdits(){document.querySelectorAll("[data-key]").forEach(el=>{const key=el.dataset.key;if(key.startsWith("p")){const m=key.match(/^p(\d+)\.(\w+)$/);if(m)d.projects[+m[1]][m[2]]=el.value}else d[key]=el.value})}
function saveEdits(){readEdits();localStorage.setItem("alankrita-portfolio",JSON.stringify(d));render();closeDialog()}
function downloadData(){readEdits();const blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="data.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);localStorage.setItem("alankrita-portfolio",JSON.stringify(d));render()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDialog()});$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeDialog()});
fetch("data.json").then(r=>r.ok?r.json():null).then(x=>{if(x&&!localStorage.getItem("alankrita-portfolio")){d={...d,...x};render()}}).catch(()=>{});render();
</script></body></html>
